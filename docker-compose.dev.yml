version: '3.8'

services:
  # MongoDB Service
  mongodb:
    image: mongo:7.0
    container_name: bloommonie-mongodb-dev
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: bloommonie
    volumes:
      - mongodb_data_dev:/data/db
      - mongodb_config_dev:/data/configdb
    networks:
      - bloommonie-network-dev
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 40s

  # Node.js Application Service (Development with hot-reload)
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: bloommonie-backend-dev
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - PORT=5000
      - MONGO_DB_CONN=mongodb://admin:admin123@mongodb:27017/bloommonie?authSource=admin
      - JWT_SECRET=dev_jwt_secret_change_in_production
      - GOOGLE_APP_PASSWORD=your_google_app_password
      - APP_VERIFY_URL=http://localhost:5000/api/users/verify
      - APP_RESET_PASSWORD_URL=http://localhost:5000/api/users/reset-password
      - GOOGLE_CLIENT_ID=your_google_client_id
      - GOOGLE_CLIENT_SECRET=your_google_client_secret
      - GOOGLE_REDIRECT_URI=http://localhost:5000/api/users/google/callback
      - TWILIO_ACCOUNT_SID=your_twilio_account_sid
      - TWILIO_AUTH_TOKEN=your_twilio_auth_token
      - TWILIO_PHONE_NUMBER=your_twilio_phone_number
      - recovery_code=dev_recovery_code
      - APIC=api
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - bloommonie-network-dev
    volumes:
      - .:/app
      - /app/node_modules
      - ./logs:/app/logs

volumes:
  mongodb_data_dev:
    driver: local
  mongodb_config_dev:
    driver: local

networks:
  bloommonie-network-dev:
    driver: bridge